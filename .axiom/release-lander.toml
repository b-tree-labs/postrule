# Warn-only RIVET for this checkout. The workflow reports and comments.
# The land command is report-only, so nothing is merged, enqueued, or pushed.
# auto_approver stays off.
#
# The workflow pins axiom-os-lm 0.70.6, which includes npm and Docker
# dependency patterns. selector_options.dependencies still lists those
# files plus the other non-Python manifests, so a Dependabot change and
# the manifests 0.70.6 does not name stay protected.
# Built-in human routes still cover behavior, pricing, security, data,
# and test setup. human_paths below adds the files in this repo that
# those defaults do not name. Workflow and CI paths are protected by
# the lander itself (.github/workflows, GitLab CI, Jenkins, CircleCI,
# Azure Pipelines).
#
# self_landers: this repo's owner. An approval from that login counts.
# Webhook fields are environment variable names. When they are empty
# the report says "no fixer configured".

mode = "warn"
language = "python"
test_command = "pytest"
forge = "github"
window_hours = 6
suite_cost = "learned"
selector = "testmon"
land_method = "merge"
signals = ["batch_label", "session", "ticket", "branch_prefix", "exact_files", "affected_scope"]

self_landers = ["benjaminbooth"]

fix_provider = "llm"

human_paths_mode = "replace"

[watch]
env = "AXIOM_LANDER_REPOS"

[token]
env = "GH_TOKEN"
scopes = ["repo"]

[selector_options]
database = ".testmondata"
full_contexts = ["merge-queue", "main", "nightly"]
# Python manifests, then npm, Docker, and the other non-Python dependency files.
dependencies = [
  '(^|/)pyproject\.toml$',
  '(^|/)requirements[^/]*\.txt$',
  '(^|/)poetry\.lock$',
  '(^|/)uv\.lock$',
  '(^|/)Pipfile(\.lock)?$',
  '(^|/)setup\.(py|cfg)$',
  '(^|/)constraints\.txt$',
  '(^|/)package\.json$',
  '(^|/)package-lock\.json$',
  '(^|/)npm-shrinkwrap\.json$',
  '(^|/)pnpm-lock\.yaml$',
  '(^|/)yarn\.lock$',
  '(^|/)bun\.lockb?$',
  '(^|/)Dockerfile[^/]*$',
  '(^|/)docker-compose[^/]*\.ya?ml$',
  '(^|/)go\.(mod|sum)$',
  '(^|/)Cargo\.(toml|lock)$',
  '(^|/)Gemfile(\.lock)?$',
  '(^|/)composer\.(json|lock)$',
  '(^|/)pom\.xml$',
  '(^|/)build\.gradle(\.kts)?$',
  '(^|/)[^/]*\.csproj$',
  '(^|/)\.github/dependabot\.ya?ml$',
]

[raci]
approvers = ["@benjaminbooth:github"]
auto_allowed = ["merge", "rerun", "update_branch", "repair"]
needs_approval = ["repair", "batch", "update_branch", "merge", "enqueue", "close", "rerun"]
max_rounds = 3
kill_switch_env = "AXIOM_LANDER_KILL"
approval_ttl_hours = 72
# auto_approver is off.

[claims]
label = "rivet:claimed"
claim_ttl_s = 3600
foreign_labels = ["janna:working"]

# Tier-1 fixer (axiom-os-private #2147): a routed model repairs lint, config and
# failing-test blockers through a fixed tool set, then RIVET lands the fix on green.
[fixer]
enabled = true
max_attempts = 2
max_turns = 16
routing_tier = "public"

[fixer.commands]
test = "python -m pytest -q {tests}"

[human_paths]
# Narrowed to the standard set (Ben, 2026-11-20; first narrowed in soilmetrix
# 2026-10-27). replace mode: this list IS the protected set; the built-in list
# no longer applies. A human approves only where a green CI run cannot judge
# the cost of a mistake: money, credentials, production data, production
# deploys. Docs about these topics, CI workflows, test setup, dependency
# bumps (dependency-audit ratchet + Boot Smoke + production smoke gate them)
# and "behavior" paths land on green like any other change.
pricing = [
  '^(?!docs/)(.*/)?(pricing|billing|stripe)(/|$)',
  '^(?!docs/)(.*/)?[^/]*(pricing|billing|stripe)[^/]*\.(py|jsx?|tsx?)$',
  '(^|/)tier_service\.py$',
]
security = [
  '^(?!docs/)(.*/)?(security|auth|secrets?)(/|$)',
  '^(?!docs/)(.*/)?(auth|secrets?|credentials?)(\.[^/]+)?$',
]
data = [
  '(^|/)migrations?(/|$)',
  '(^|/)schema(/|$)',
  '\.sql$',
]
deploy = [
  '(^|/)\.github/workflows/[^/]*(deploy|release|publish|promote|terraform)[^/]*$',
  '^infrastructure/terraform/environments/(prod|stg)/',
]
