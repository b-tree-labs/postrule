# Warn-only RIVET for this checkout. The workflow reports and comments.
# The land command is report-only, so nothing is merged, enqueued, or pushed.
# auto_approver stays off.
#
# The workflow pins axiom-os-lm 0.70.6, which includes npm and Docker
# dependency patterns. selector_options.dependencies still lists those
# files plus the other non-Python manifests, so a Dependabot change and
# the manifests 0.70.6 does not name stay protected.
# Built-in human routes still cover behavior, pricing, security, data,
# and test setup. human_paths below adds the files in this repo that
# those defaults do not name. Workflow and CI paths are protected by
# the lander itself (.github/workflows, GitLab CI, Jenkins, CircleCI,
# Azure Pipelines).
#
# self_landers: this repo's owner. An approval from that login counts.
# Webhook fields are environment variable names. When they are empty
# the report says "no fixer configured".

mode = "warn"
language = "python"
test_command = "pytest"
forge = "github"
window_hours = 6
suite_cost = "learned"
selector = "testmon"
land_method = "merge"
signals = ["batch_label", "session", "ticket", "branch_prefix", "exact_files", "affected_scope"]

self_landers = ["benjaminbooth"]

[watch]
env = "AXIOM_LANDER_REPOS"

[token]
env = "GH_TOKEN"
scopes = ["repo"]

[selector_options]
database = ".testmondata"
full_contexts = ["merge-queue", "main", "nightly"]
# Python manifests, then npm, Docker, and the other non-Python dependency files.
dependencies = [
  '(^|/)pyproject\.toml$',
  '(^|/)requirements[^/]*\.txt$',
  '(^|/)poetry\.lock$',
  '(^|/)uv\.lock$',
  '(^|/)Pipfile(\.lock)?$',
  '(^|/)setup\.(py|cfg)$',
  '(^|/)constraints\.txt$',
  '(^|/)package\.json$',
  '(^|/)package-lock\.json$',
  '(^|/)npm-shrinkwrap\.json$',
  '(^|/)pnpm-lock\.yaml$',
  '(^|/)yarn\.lock$',
  '(^|/)bun\.lockb?$',
  '(^|/)Dockerfile[^/]*$',
  '(^|/)docker-compose[^/]*\.ya?ml$',
  '(^|/)go\.(mod|sum)$',
  '(^|/)Cargo\.(toml|lock)$',
  '(^|/)Gemfile(\.lock)?$',
  '(^|/)composer\.(json|lock)$',
  '(^|/)pom\.xml$',
  '(^|/)build\.gradle(\.kts)?$',
  '(^|/)[^/]*\.csproj$',
  '(^|/)\.github/dependabot\.ya?ml$',
]

[fix_provider]
name = "handoff"

[fix_provider.webhook]
url_env = "RELEASE_FIX_WEBHOOK_URL"
key_env = "RELEASE_FIX_WEBHOOK_KEY"
key_header = "X-Fix-Key"
separate_reviewer = true

[human_paths]
behavior = [
  '(^|/)src/postrule/(core|gates|switch_class|ml|ml_strategy|models|escalation|signals|defaults|decorator|wrap)\.py$',
]
pricing = [
  '(^|/)[^/]*pric(e|ing)[^/]*$',
  '(^|/)shared/pricing/',
  '(^|/)roi\.py$',
]
security = [
  '(^|/)SECURITY\.md$',
  '(^|/)[^/]*security[^/]*$',
  '(^|/)license\.py$',
  '(^|/)_http_tls\.py$',
  '(^|/)redteam/',
  '(^|/)\.axiom/release-lander\.toml$',
]
data = [
  '(^|/)storage(_[a-z0-9]+)?\.py$',
]
test-setup = [
  '(^|/)\.pre-commit-config\.yaml$',
]

[raci]
approvers = ["@benjaminbooth:github"]
auto_allowed = []
needs_approval = ["repair", "batch", "update_branch", "merge", "enqueue", "close", "rerun"]
max_rounds = 3
kill_switch_env = "AXIOM_LANDER_KILL"
approval_ttl_hours = 72
# auto_approver is off.

[claims]
label = "rivet:claimed"
claim_ttl_s = 3600
foreign_labels = ["janna:working"]
