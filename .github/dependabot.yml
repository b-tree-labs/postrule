#
# Grouped dependency updates. One weekly pull request per ecosystem,
# capped so a noisy manifest cannot open an unbounded queue.
# Manifests in this repo: pyproject.toml (pip) and GitHub Actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
