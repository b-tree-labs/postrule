# RIVET, the pull-request lander, from the shared action (axiom-os-private #2147).
# Behaviour lives in b-tree-labs/axiom-os/actions/rivet-land; this repo pins a release and
# keeps its own config in .axiom/release-lander.toml. Kill switch: set the
# repository variable AXIOM_LANDER_KILL=1.
name: RIVET lander

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: rivet-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: write
  statuses: read

jobs:
  rivet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: b-tree-labs/axiom-os/actions/rivet-land@rivet-land-v1
        with:
          owner: benjaminbooth
          kill-switch: ${{ vars.AXIOM_LANDER_KILL }}
          release-lock: ${{ vars.AXIOM_RELEASE_LOCK }}
          app-id: ${{ vars.RIVET_APP_ID }}
          app-private-key: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
