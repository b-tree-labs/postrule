#
# Triggered on every push to `main`. Detects whether `pyproject.toml`
# version has an existing matching `v*` tag; if not, auto-tags the
# current commit, builds wheel + sdist, publishes to PyPI via the
# trusted-publisher (OIDC) binding, and cuts a GitHub Release.
#
# Design intent: green main is sufficient to trigger a release. The
# release artifact (PyPI + GitHub Release) is derived from the source-
# of-truth `version = "..."` line in pyproject.toml, not from a
# separate ceremony (`git tag v*`). A merge that bumps the version
# IS the release; a merge that doesn't is a no-op.
#
# Publishes from THIS PRIVATE monorepo so the wheel is built from the COMPLETE
# source (incl. the BSL modules cloud/auth/cli). The public mirror is a
# BSL-stripped source copy; building the wheel there omits those modules (which
# is how 1.1.16/1.1.17 shipped broken). The release jobs are guarded to
# `github.repository == 'b-tree-labs/postrule-private'` so the mirrored copy of
# this workflow never tags/builds/publishes.
#
# Setup (one-time, on PyPI):
#   1. https://pypi.org/manage/account/publishing/  (project: postrule)
#   2. Add a Trusted Publisher with:
#        Project name:      postrule
#        Owner:             b-tree-labs
#        Repository name:   postrule-private        ← the publisher is PRIVATE
#        Workflow filename: release.yml             ← matches THIS file
#        Environment name:  pypi
#
# After the binding is active, no PYPI_API_TOKEN secret is required;
# OIDC-issued short-lived tokens authenticate the upload. The tag
# push the workflow itself performs uses the default GITHUB_TOKEN.
#
# Self-contained on purpose — no dependency on a reusable workflow
# in a sibling org repo. If b-tree-labs gains multiple Python
# packages later, refactor to a reusable workflow then; not now.

name: release

on:
  push:
    branches: [main]
  # Manual override for emergencies (e.g. republishing a yanked
  # version, or re-tagging after a force-push to main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Detect unreleased version bump
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history + tags so we can compare pyproject version
          # against existing release tags.
          fetch-depth: 0

      - id: check
        name: Compare pyproject.toml version vs existing tags
        run: |
          set -euo pipefail
          version=$(grep -E '^version = "' pyproject.toml | sed -E 's/^version = "(.+)"$/\1/')
          tag="v$version"
          echo "Current pyproject version: $version"
          echo "Looking for tag: $tag"
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists — no release needed."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag does not exist — will release."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  tag:
    name: Tag the release commit
    needs: check-version
    # Release actions run ONLY in the private monorepo, which is the source of
    # truth + the PyPI publisher. The public mirror is a (BSL-stripped) source
    # copy and must NOT tag/build/publish — its wheel would omit cloud/auth/cli.
    if: needs.check-version.outputs.should-release == 'true' && github.repository == 'b-tree-labs/postrule-private'
    runs-on: ubuntu-latest
    permissions:
      # Push the new vX.Y.Z tag back to the repo.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push tag
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  trigger-sync:
    # Kick the private→public mirror sync explicitly. We cannot rely on the
    # `on: push: tags` trigger in sync-to-public.yml: the tag above is pushed
    # with the default GITHUB_TOKEN, and tags pushed by GITHUB_TOKEN do NOT
    # trigger other workflows (GitHub's recursion guard). A workflow_dispatch
    # issued via GITHUB_TOKEN *does* run, so dispatch the sync directly here.
    # Guarded to the monorepo so the synced copy of this file is a no-op in the
    # public mirror (which has no sync-to-public.yml).
    name: Trigger public mirror sync
    needs: [check-version, tag]
    if: needs.check-version.outputs.should-release == 'true' && github.repository == 'b-tree-labs/postrule-private'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # No checkout — pass --repo explicitly so `gh` doesn't try to infer the
      # target from a (nonexistent) local git checkout.
      - name: Dispatch sync-to-public (real run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-to-public.yml --repo "${{ github.repository }}" --ref main -f dry_run=false
          echo "Dispatched sync-to-public.yml for ${{ needs.check-version.outputs.tag }}"

  build:
    name: Build distributions
    needs: [check-version, tag]
    # Private-only: builds the FULL wheel (incl. cloud/auth/cli) from the
    # complete monorepo source. (The public mirror lacks those BSL modules.)
    if: needs.check-version.outputs.should-release == 'true' && github.repository == 'b-tree-labs/postrule-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the freshly-pushed tag so the build sees the
          # exact ref that just got published.
          ref: ${{ needs.check-version.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Show artifact contents
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    if: github.repository == 'b-tree-labs/postrule-private'
    runs-on: ubuntu-latest
    # `pypi` matches the environment name in the trusted-publisher
    # binding above. The environment also gates on any branch /
    # protection rules you choose to add at github.com/b-tree-labs/
    # postrule/settings/environments/pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/postrule
    permissions:
      # Required for OIDC-based PyPI auth. Do NOT add `contents: write`
      # or `actions: write` here — publish should not touch the repo.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No password / token kwarg — OIDC handles auth.
          # Verbose so the workflow log is auditable.
          verbose: true
          print-hash: true

  github-release:
    name: Create GitHub Release
    needs: [check-version, publish]
    if: github.repository == 'b-tree-labs/postrule-private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.tag, 'rc') || contains(needs.check-version.outputs.tag, 'beta') || contains(needs.check-version.outputs.tag, 'alpha') }}
